services:
  - type: web
    name: intelligent-classroom-saver-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/render_start.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: intelligent-classroom-saver-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ESP32_API_KEY
        generateValue: true
      - key: DEFAULT_CARD_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      - key: CORS_ALLOW_ORIGINS
        value: "*"

databases:
  - name: intelligent-classroom-saver-db
    plan: free
    region: oregon
    databaseName: ics_backend
    postgresMajorVersion: "17"
