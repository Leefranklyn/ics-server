services:
  - type: web
    name: intelligent-classroom-saver-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/render_start.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: ESP32_API_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "false"
      - key: CORS_ALLOW_ORIGINS
        value: "*"
